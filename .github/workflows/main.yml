name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find V7 project
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "jadwal-drosey-v7-*.zip" | head -n 1)
          echo "Using project: $ZIP"
          test -n "$ZIP"

      - name: Extract V7
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "jadwal-drosey-v7-*.zip" | head -n 1)
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p android-project assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: جدول-دروسي-V7-APK
          path: "android-project/app/build/outputs/apk/debug/*.apk"
